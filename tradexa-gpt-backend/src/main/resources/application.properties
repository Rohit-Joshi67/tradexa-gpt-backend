spring.application.name=tradexa-gpt-backend

# ==========================
# PostgreSQL / Supabase
# ==========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# Flyway (replaces ddl-auto=update)
# ==========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================
# Razorpay billing
# Fill these in on Render (leave empty until the Razorpay account is connected).
# The app boots fine without them; billing endpoints return 503 until configured.
# ==========================
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.plan.pro.monthly=${RAZORPAY_PLAN_PRO_MONTHLY:}
razorpay.plan.pro.monthly-launch=${RAZORPAY_PLAN_PRO_MONTHLY_LAUNCH:}
razorpay.plan.pro.yearly=${RAZORPAY_PLAN_PRO_YEARLY:}
razorpay.plan.pro.yearly-launch=${RAZORPAY_PLAN_PRO_YEARLY_LAUNCH:}

# ==========================
# Server
# ==========================
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
# Short-lived access token (15 min) + rotating refresh token (7 days, httpOnly cookie).
# The legacy JWT_EXPIRATION (24h single token) is retired.
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================
# Auth cookies
# ==========================
# Secure=true requires HTTPS (set AUTH_COOKIE_SECURE=true on Render).
# SameSite=None is required when the frontend and backend are on different
# domains (Vercel + Render); None requires Secure=true.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAMESITE:Lax}

# Frontend base URL for emailed links (verify / reset password).
app.frontend-url=${FRONTEND_URL:https://tradexa-gpt-frontend.vercel.app}

# Swagger / OpenAPI docs: public unless disabled.
app.swagger.enabled=${SWAGGER_ENABLED:true}

# ==========================
# Email (env-gated like Razorpay)
# Fill these in on Render (leave empty until an email provider is connected).
# The app boots fine without them: registration auto-verifies new users and
# logs a warning; password reset returns 503 until configured.
# ==========================
email.provider=${EMAIL_PROVIDER:}
email.api-key=<redacted>
email.from=${EMAIL_FROM:}

# ==========================
# LLM / Tradexa-GPT copilot (env-gated like Razorpay and email)
# Fill GEMINI_API_KEY in on Render to enable the copilot.
# The app boots fine without it; copilot endpoints return 503 until configured.
# Paid models are NEVER used unless LLM_ALLOW_PAID=true.
# ==========================
llm.gemini-api-key=${GEMINI_API_KEY:}
llm.model=${LLM_MODEL:gemini-2.0-flash}
llm.max-tokens=${LLM_MAX_TOKENS:1024}
llm.temperature=${LLM_TEMPERATURE:0.7}
llm.allow-paid=${LLM_ALLOW_PAID:false}
llm.daily-message-limit=${COPILOT_DAILY_LIMIT:50}

# ==========================
# CORS
# ==========================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Batching for massive speedup
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true



# Multipart file size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

